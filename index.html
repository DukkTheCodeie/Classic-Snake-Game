<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
:root {
  --bg-color: #0d0e15;
  --panel-color: #1a1c28;
  --neon-green: #39ff14;
  --neon-red: #ff3131;
  --neon-blue: #00f0ff;
  --neon-purple: #bd00ff;
  --text-color: #ffffff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  user-select: none;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  background: radial-gradient(circle at center, #1e2235 0%, #0d0e15 100%);
}

#game-container {
  display: flex;
  flex-direction: row;
  gap: 20px;
  background: var(--panel-color);
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

@media (max-width: 800px) {
  #game-container {
    flex-direction: column;
    align-items: center;
  }
}

.side-panel {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 220px;
}

.header h1 {
  font-size: 24px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-align: center;
  margin-bottom: 10px;
  color: var(--neon-blue);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
}

.score-board {
  display: flex;
  justify-content: space-around;
  background: rgba(0, 0, 0, 0.3);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.score-box {
  text-align: center;
}

.score-box span {
  display: block;
  font-size: 12px;
  color: #a0a0a0;
  text-transform: uppercase;
}

.score-box strong {
  font-size: 20px;
  color: var(--neon-green);
}

.mode-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 10px 0 8px;
}

.mode-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mode-group label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #a3b4c8;
}

.mode-group select {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(0, 240, 255, 0.5);
  color: var(--text-color);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
}

.mode-group select:focus {
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
}

canvas {
  background: #05060a;
  border: 2px solid var(--neon-blue);
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.2) inset;
  display: block;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 15px;
}

.control-row {
  display: flex;
  gap: 10px;
}

.btn {
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid var(--neon-blue);
  color: var(--text-color);
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}

.btn:active {
  background: var(--neon-blue);
  color: #000;
  box-shadow: 0 0 15px var(--neon-blue);
}
</style>
</head>
<body>
<div id="game-container">
  <div class="side-panel">
    <div class="header">
      <h1>Snake</h1>
      <div class="score-board">
        <div class="score-box">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span>High</span>
          <strong id="high-score">0</strong>
        </div>
      </div>
    </div>

    <div class="mode-panel">
      <div class="mode-group">
        <label for="difficulty-select">Difficulty</label>
        <select id="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="insane">Insane</option>
        </select>
      </div>

      <div class="mode-group">
        <label for="map-select">Map</label>
        <select id="map-select">
          <option value="classic" selected>Classic</option>
          <option value="maze">Maze</option>
          <option value="cross">Cross</option>
          <option value="spiral">Spiral</option>
        </select>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btn-up">UP</button>
      <div class="control-row">
        <button class="btn" id="btn-left">LEFT</button>
        <button class="btn" id="btn-down">DOWN</button>
        <button class="btn" id="btn-right">RIGHT</button>
      </div>
      <button class="btn" id="btn-start" style="margin-top: 10px; width: 100%;">START / RESTART</button>
    </div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const difficultySelect = document.getElementById('difficulty-select');
const mapSelect = document.getElementById('map-select');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

const difficultySettings = {
  easy: 130,
  medium: 100,
  hard: 75,
  insane: 55
};

const maps = {
  classic: {
    name: 'Classic',
    walls: [],
    spawn: [{ x: 10, y: 10 }],
    direction: { x: 1, y: 0 }
  },
  maze: {
    name: 'Maze',
    walls: [
      ...Array.from({ length: 16 }, (_, i) => [4, i + 2]),
      ...Array.from({ length: 16 }, (_, i) => [14, i + 2]),
      ...Array.from({ length: 16 }, (_, i) => [i + 2, 8]),
      ...Array.from({ length: 16 }, (_, i) => [i + 2, 12])
    ].filter(([x, y]) => !(x === 10 && y === 10)),
    spawn: [{ x: 9, y: 10 }, { x: 10, y: 10 }, { x: 11, y: 10 }],
    direction: { x: 1, y: 0 }
  },
  cross: {
    name: 'Cross',
    walls: [
      ...Array.from({ length: 10 }, (_, i) => [i + 5, 9]),
      ...Array.from({ length: 10 }, (_, i) => [9, i + 5]),
      ...Array.from({ length: 7 }, (_, i) => [i + 6, 15]),
      ...Array.from({ length: 7 }, (_, i) => [i + 6, 4]),
      ...Array.from({ length: 7 }, (_, i) => [15, i + 6]),
      ...Array.from({ length: 7 }, (_, i) => [4, i + 6])
    ],
    spawn: [{ x: 2, y: 10 }, { x: 3, y: 10 }, { x: 4, y: 10 }],
    direction: { x: 1, y: 0 }
  },
  spiral: {
    name: 'Spiral',
    walls: [
      ...Array.from({ length: 17 }, (_, i) => [i + 2, 2]),
      ...Array.from({ length: 16 }, (_, i) => [17, i + 2]),
      ...Array.from({ length: 15 }, (_, i) => [17 - i, 17]),
      ...Array.from({ length: 15 }, (_, i) => [2, 17 - i]),
      ...Array.from({ length: 11 }, (_, i) => [i + 4, 6]),
      ...Array.from({ length: 11 }, (_, i) => [15, i + 6]),
      ...Array.from({ length: 11 }, (_, i) => [15 - i, 13]),
      ...Array.from({ length: 11 }, (_, i) => [4, 13 - i])
    ],
    spawn: [{ x: 3, y: 10 }, { x: 4, y: 10 }, { x: 5, y: 10 }],
    direction: { x: 1, y: 0 }
  }
};

let snake = [{ x: 10, y: 10 }];
let food = { x: 15, y: 15 };
let dx = 1;
let dy = 0;
let nextDx = 1;
let nextDy = 0;
let score = 0;
let highScore = 0;
let gameInterval = null;
let speed = difficultySettings.medium;
let currentMap = mapSelect.value;
let currentDifficulty = difficultySelect.value;

function getCurrentMap() {
  return maps[currentMap];
}

function drawWalls() {
  const wallColor = '#0d2c66';
  const wallGlow = '#00f0ff';

  getCurrentMap().walls.forEach(([wallX, wallY]) => {
    const px = wallX * gridSize + 1;
    const py = wallY * gridSize + 1;
    const size = gridSize - 2;

    ctx.fillStyle = wallColor;
    ctx.fillRect(px, py, size, size);

    ctx.strokeStyle = wallGlow;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 1, py + 1, size - 2, size - 2);
  });
}

function drawFood() {
  const x = food.x * gridSize + gridSize / 2;
  const y = food.y * gridSize + gridSize / 2;
  const radius = gridSize / 2 - 2;
  const pulse = 1 + Math.sin(Date.now() * 0.01) * 0.18;

  ctx.save();
  ctx.translate(x, y);

  ctx.shadowBlur = 25;
  ctx.shadowColor = '#ff4d8d';

  const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, radius * 2.4);
  glow.addColorStop(0, '#fff7ff');
  glow.addColorStop(0.18, '#ffd9f2');
  glow.addColorStop(0.4, '#ff4d8d');
  glow.addColorStop(0.75, '#ff1f6d');
  glow.addColorStop(1, '#7a0737');

  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, radius * pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, radius * 1.15, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255, 250, 200, 0.9)';
  ctx.beginPath();
  ctx.moveTo(0, -radius * 0.65);
  ctx.lineTo(radius * 0.7, 0);
  ctx.lineTo(0, radius * 0.65);
  ctx.lineTo(-radius * 0.7, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(-2, -radius * 1.1, 4, radius * 0.7);
  ctx.fillRect(-radius * 1.1, -2, radius * 0.7, 4);

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-radius * 0.5, -radius * 0.8);
  ctx.lineTo(-radius * 0.2, -radius * 0.3);
  ctx.lineTo(-radius * 0.55, radius * 0.15);
  ctx.moveTo(radius * 0.55, -radius * 0.8);
  ctx.lineTo(radius * 0.2, -radius * 0.3);
  ctx.lineTo(radius * 0.55, radius * 0.15);
  ctx.stroke();

  ctx.restore();
}

function drawBodySegment(segmentX, segmentY, isHead = false) {
  const x = segmentX * gridSize + 1;
  const y = segmentY * gridSize + 1;
  const size = gridSize - 2;

  if (isHead) {
    const headGradient = ctx.createLinearGradient(x, y, x + size, y + size);
    headGradient.addColorStop(0, '#b7ff7a');
    headGradient.addColorStop(0.35, '#55ff88');
    headGradient.addColorStop(1, '#1bcf73');

    ctx.fillStyle = headGradient;
    ctx.fillRect(x, y, size, size);

    ctx.fillStyle = 'rgba(10, 16, 20, 0.6)';
    ctx.fillRect(x + 3, y + 2, 5, 5);
    ctx.fillRect(x + size - 8, y + 2, 5, 5);

    ctx.fillStyle = '#f6fffe';
    const pupilOffsetX = dx === 1 ? 2 : dx === -1 ? -2 : 0;
    const pupilOffsetY = dy === 1 ? 2 : dy === -1 ? -2 : 0;

    ctx.fillRect(x + 4 + pupilOffsetX, y + 4 + pupilOffsetY, 2, 2);
    ctx.fillRect(x + size - 6 + pupilOffsetX, y + 4 + pupilOffsetY, 2, 2);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.fillRect(x + 3, y + 3, 4, 3);
    ctx.fillRect(x + size - 7, y + 3, 4, 3);

    return;
  }

  const bodyGradient = ctx.createLinearGradient(x, y, x + size, y + size);
  bodyGradient.addColorStop(0, '#67ffd5');
  bodyGradient.addColorStop(0.5, '#21e6b2');
  bodyGradient.addColorStop(1, '#00b7d8');

  ctx.fillStyle = bodyGradient;
  ctx.fillRect(x, y, size, size);

  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(x + 2, y + 2, size * 0.25, 3);
  ctx.fillRect(x + size * 0.56, y + 2, size * 0.18, 3);

  ctx.fillStyle = 'rgba(15, 25, 35, 0.18)';
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(x + 4 + i * 5, y + size - 5, 2, 3);
  }
}

function wallExists(x, y) {
  return getCurrentMap().walls.some(([wallX, wallY]) => wallX === x && wallY === y);
}

function drawGame() {
  dx = nextDx;
  dy = nextDy;

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    gameOver();
    return;
  }

  if (wallExists(head.x, head.y)) {
    gameOver();
    return;
  }

  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) {
      gameOver();
      return;
    }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
    }
    placeFood();
  } else {
    snake.pop();
  }

  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0);
    ctx.lineTo(i * gridSize, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * gridSize);
    ctx.lineTo(canvas.width, i * gridSize);
    ctx.stroke();
  }

  drawWalls();

  snake.forEach((part, index) => {
    drawBodySegment(part.x, part.y, index === 0);
  });

  drawFood();
}

function placeFood() {
  const map = getCurrentMap();
  let attempts = 0;

  while (attempts < 500) {
    const x = Math.floor(Math.random() * tileCount);
    const y = Math.floor(Math.random() * tileCount);

    const collidesWithSnake = snake.some(part => part.x === x && part.y === y);
    const collidesWithWall = wallExists(x, y);

    if (!collidesWithSnake && !collidesWithWall) {
      food.x = x;
      food.y = y;
      return;
    }

    attempts += 1;
  }

  food = { x: 15, y: 15 };
}

function changeDirection(newDx, newDy) {
  if (newDx === -dx && newDx !== 0) return;
  if (newDy === -dy && newDy !== 0) return;
  nextDx = newDx;
  nextDy = newDy;
}

function gameOver() {
  clearInterval(gameInterval);
  gameInterval = null;
}

function startGame() {
  clearInterval(gameInterval);

  speed = difficultySettings[currentDifficulty];
  const selectedMap = getCurrentMap();

  snake = selectedMap.spawn.map(part => ({ ...part }));
  dx = selectedMap.direction.x;
  dy = selectedMap.direction.y;
  nextDx = dx;
  nextDy = dy;
  score = 0;
  scoreEl.textContent = score;

  placeFood();
  drawGame();
  gameInterval = setInterval(drawGame, speed);
}

window.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp':
    case 'w':
    case 'W':
      changeDirection(0, -1);
      break;
    case 'ArrowDown':
    case 's':
    case 'S':
      changeDirection(0, 1);
      break;
    case 'ArrowLeft':
    case 'a':
    case 'A':
      changeDirection(-1, 0);
      break;
    case 'ArrowRight':
    case 'd':
    case 'D':
      changeDirection(1, 0);
      break;
  }
});

document.getElementById('btn-up').addEventListener('click', () => changeDirection(0, -1));
document.getElementById('btn-down').addEventListener('click', () => changeDirection(0, 1));
document.getElementById('btn-left').addEventListener('click', () => changeDirection(-1, 0));
document.getElementById('btn-right').addEventListener('click', () => changeDirection(1, 0));
document.getElementById('btn-start').addEventListener('click', startGame);

mapSelect.addEventListener('change', () => {
  currentMap = mapSelect.value;
  if (gameInterval) {
    startGame();
  } else {
    drawGame();
  }
});

difficultySelect.addEventListener('change', () => {
  currentDifficulty = difficultySelect.value;
  if (gameInterval) {
    startGame();
  }
});

currentMap = mapSelect.value;
currentDifficulty = difficultySelect.value;

placeFood();
drawGame();
</script>
</body>
</html>
