<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Snake</title>
  <style>
    :root {
      --bg-1: #060b1a;
      --bg-2: #0d1530;
      --panel: rgba(17, 21, 36, 0.82);
      --panel-strong: rgba(15, 18, 30, 0.96);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #edf4ff;
      --muted: #a8b6d6;
      --green-1: #6ef7b2;
      --green-2: #19d38d;
      --cyan-1: #79e8ff;
      --cyan-2: #4ca8ff;
      --pink: #ff5bbd;
      --purple: #a778ff;
      --gold: #ffd166;
      --danger: #ff5d73;
      --shadow: rgba(11, 15, 26, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    html, body { height: 100%; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(90, 104, 255, 0.28), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(28, 221, 202, 0.18), transparent 28%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, #040912 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    .app-shell {
      width: min(92vw, 960px);
      padding: 26px 18px 20px;
      border-radius: 28px;
      background: rgba(16, 22, 36, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 0 6px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.76rem;
      color: var(--text);
      opacity: 0.9;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-1), var(--cyan-1));
      box-shadow: 0 0 18px rgba(110, 247, 178, 0.8);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(121, 232, 255, 0.1);
      border: 1px solid rgba(121, 232, 255, 0.2);
      color: var(--cyan-1);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .status-pill.warn { background: rgba(255, 209, 102, 0.08); border-color: rgba(255, 209, 102, 0.26); color: var(--gold); }
    .status-pill.danger { background: rgba(255, 93, 115, 0.09); border-color: rgba(255, 93, 115, 0.28); color: #ff9bab; }

    #game-container {
      display: flex;
      flex-direction: row;
      gap: 24px;
      align-items: stretch;
      justify-content: center;
      padding: 22px 16px 16px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(11, 15, 27, 0.9), rgba(18, 23, 37, 0.82));
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: min(260px, 28vw);
      background: linear-gradient(180deg, rgba(22,29,43,0.7), rgba(10,14,22,0.78));
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 18px 16px 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .header h1 {
      position: relative;
      margin-bottom: 14px;
      font-size: clamp(1.5rem, 2vw, 2.35rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      color: var(--text);
      text-shadow: 0 0 26px rgba(117, 225, 255, 0.28);
      background: linear-gradient(135deg, #dff8ff 0%, #7ae6ff 20%, #6ef7b2 55%, #a778ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .score-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      background: rgba(7, 11, 20, 0.45);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 10px 8px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .score-box {
      text-align: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
    }

    .score-box span {
      display: block;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .score-box strong {
      display: block;
      font-size: clamp(1.25rem, 2vw, 1.8rem);
      font-weight: 800;
      line-height: 1;
      color: var(--green-1);
      text-shadow: 0 0 18px rgba(110, 247, 178, 0.5);
    }

    #high-score { color: var(--cyan-1); text-shadow: 0 0 18px rgba(121, 232, 255, 0.45); }

    .mode-panel { display: flex; flex-direction: column; gap: 12px; margin: 18px 0 12px; }
    .mode-group { display: flex; flex-direction: column; gap: 7px; }
    .mode-group label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mode-group select {
      width: 100%;
      background: rgba(9, 15, 26, 0.68);
      border: 1px solid rgba(117, 225, 255, 0.32);
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 0.96rem;
      font-weight: 600;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--cyan-1) 50%), linear-gradient(135deg, var(--cyan-1) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(1.1em + 2px), calc(100% - 13px) calc(1.1em + 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .mode-group select:focus { border-color: rgba(110, 247, 178, 0.7); box-shadow: 0 0 0 3px rgba(110, 247, 178, 0.18); }

    .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; }

    .btn {
      position: relative;
      border: 1px solid rgba(121, 232, 255, 0.22);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(17, 31, 47, 0.92), rgba(12, 17, 26, 0.96));
      color: var(--text);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 12px 14px;
      transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 8px 18px rgba(6, 8, 16, 0.28);
    }

    .btn:hover { border-color: rgba(110, 247, 178, 0.5); box-shadow: 0 0 0 3px rgba(110,247,178,0.08), 0 10px 22px rgba(15, 25, 38, 0.38); }
    .btn:active { transform: translateY(1px) scale(0.99); }
    #btn-start { width: 100%; background: linear-gradient(135deg, rgba(110, 247, 178, 0.16), rgba(121, 232, 255, 0.14)); border-color: rgba(110, 247, 178, 0.5); }
    #btn-customize { width: 100%; background: linear-gradient(135deg, rgba(167, 120, 255, 0.16), rgba(255, 91, 189, 0.14)); border-color: rgba(167, 120, 255, 0.45); }

    .board-frame {
      position: relative;
      background: linear-gradient(180deg, rgba(19, 24, 35, 0.86), rgba(7, 10, 18, 0.9));
      border-radius: 22px;
      padding: 14px;
      border: 1px solid rgba(121, 232, 255, 0.18);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 14px 30px rgba(0,0,0,0.32), 0 0 24px rgba(94, 234, 212, 0.18);
      touch-action: none;
      user-select: none;
    }

    canvas {
      display: block;
      background: linear-gradient(180deg, #040915 0%, #0b1020 100%);
      border: 2px solid rgba(121, 232, 255, 0.45);
      border-radius: 14px;
      box-shadow: inset 0 0 34px rgba(52, 105, 160, 0.18), 0 0 18px rgba(76, 168, 255, 0.12);
      width: min(72vw, 460px);
      height: auto;
      touch-action: none;
    }

    .board-overlay {
      position: absolute;
      inset: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 14px;
      background: rgba(5, 9, 17, 0.38);
      border: 1px solid rgba(255,255,255,0.06);
      color: #ebf6ff;
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      text-shadow: 0 0 20px rgba(121, 232, 255, 0.4);
      pointer-events: none;
      transition: opacity 0.18s ease;
      opacity: 1;
    }

    .board-overlay.hidden { opacity: 0; }

    .customize-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 16, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .customize-modal.visible { opacity: 1; pointer-events: auto; }

    .customize-panel {
      width: min(92vw, 620px);
      max-height: 90vh;
      overflow: auto;
      background: linear-gradient(180deg, rgba(20, 27, 41, 0.96), rgba(12, 16, 26, 0.96));
      border: 1px solid rgba(157, 169, 194, 0.18);
      border-radius: 22px;
      padding: 20px 18px 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.4);
    }

    .customize-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .customize-header h2 {
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .customize-grid { display: grid; gap: 16px; }
    .custom-row { display: flex; flex-direction: column; gap: 7px; }
    .custom-row label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .custom-row select,
    .custom-row input {
      width: 100%;
      background: rgba(9, 15, 26, 0.7);
      border: 1px solid rgba(117, 225, 255, 0.32);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .customize-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

    .dev-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      margin-top: 4px;
    }

    .dev-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dev-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--green-2);
      cursor: pointer;
    }

    .dev-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(110, 247, 178, 0.12);
      border: 1px solid rgba(110, 247, 178, 0.35);
      color: var(--green-1);
      margin-bottom: 12px;
    }

    @media (max-width: 800px) {
      #game-container { flex-direction: column; align-items: center; }
      .side-panel { width: min(100%, 420px); }
      .board-frame { width: 100%; }
      canvas { width: min(82vw, 460px); }
      .dev-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand"><span class="brand-dot"></span> Snake</div>
      <div class="status-pill" id="status-pill">Ready</div>
    </div>

    <div id="game-container">
      <div class="side-panel">
        <div class="header">
          <h1>Snake</h1>
          <div class="score-board">
            <div class="score-box">
              <span>Score</span>
              <strong id="score">0</strong>
            </div>
            <div class="score-box">
              <span>High</span>
              <strong id="high-score">0</strong>
            </div>
          </div>
        </div>

        <div class="mode-panel">
          <div class="mode-group">
            <label for="difficulty-select">Difficulty</label>
            <select id="difficulty-select">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
              <option value="insane">Insane</option>
            </select>
          </div>

          <div class="mode-group">
            <label for="map-select">Map</label>
            <select id="map-select">
              <option value="classic" selected>Classic</option>
              <option value="maze">Maze</option>
              <option value="cross">Cross</option>
              <option value="spiral">Spiral</option>
              <option value="ring">Ring</option>
              <option value="labyrinth">Labyrinth</option>
              <option value="diamond">Diamond</option>
            </select>
          </div>
        </div>

        <div class="controls">
          <button class="btn" id="btn-start" style="margin-top: 8px;">START / RESTART</button>
          <button class="btn" id="btn-customize">Customize</button>
        </div>
      </div>

      <div class="board-frame" id="board-frame">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="board-overlay hidden" id="board-overlay">Game Over</div>
      </div>
    </div>
  </div>

  <div class="customize-modal" id="customize-modal" aria-hidden="true">
    <div class="customize-panel" role="dialog" aria-modal="true" aria-labelledby="customize-title">
      <div class="customize-header">
        <h2 id="customize-title">Customize + Dev</h2>
        <button class="close-btn" id="close-customize" aria-label="Close customize menu">×</button>
      </div>

      <div class="customize-grid">
        <div class="custom-row">
          <div class="dev-pill">Dev Code: 1923</div>
          <label for="dev-code-input">Enter dev code</label>
          <input id="dev-code-input" type="text" maxlength="4" placeholder="1923" />
        </div>

        <div class="custom-row">
          <label for="snake-color-select">Snake Color</label>
          <select id="snake-color-select"></select>
        </div>

        <div class="custom-row">
          <label for="snake-skin-select">Snake Skin</label>
          <select id="snake-skin-select"></select>
        </div>

        <div class="custom-row">
          <label for="food-style-select">Food Style</label>
          <select id="food-style-select"></select>
        </div>

        <div class="custom-row">
          <label>Dev Controls</label>
          <div class="dev-grid">
            <label class="dev-toggle"><span>God mode</span><input type="checkbox" id="dev-god" /></label>
            <label class="dev-toggle"><span>No walls</span><input type="checkbox" id="dev-no-walls" /></label>
            <label class="dev-toggle"><span>Ghost mode</span><input type="checkbox" id="dev-ghost" /></label>
            <label class="dev-toggle"><span>Auto eat</span><input type="checkbox" id="dev-auto-eat" /></label>
            <label class="dev-toggle"><span>Slow motion</span><input type="checkbox" id="dev-slow" /></label>
            <label class="dev-toggle"><span>Show grid</span><input type="checkbox" id="dev-grid" /></label>
          </div>
        </div>

        <div class="custom-row">
          <label for="dev-speed">Speed Multiplier</label>
          <input id="dev-speed" type="range" min="0.5" max="3" step="0.1" value="1" />
        </div>

        <div class="custom-row">
          <label for="dev-grow">Growth</label>
          <input id="dev-grow" type="number" min="1" max="50" value="5" />
        </div>
      </div>

      <div class="customize-actions">
        <button class="btn" id="dev-apply">Apply</button>
        <button class="btn" id="save-customize">Save</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const difficultySelect = document.getElementById('difficulty-select');
    const mapSelect = document.getElementById('map-select');
    const statusPill = document.getElementById('status-pill');
    const boardOverlay = document.getElementById('board-overlay');
    const customizeModal = document.getElementById('customize-modal');
    const closeCustomize = document.getElementById('close-customize');
    const saveCustomize = document.getElementById('save-customize');
    const btnCustomize = document.getElementById('btn-customize');
    const btnStart = document.getElementById('btn-start');
    const snakeColorSelect = document.getElementById('snake-color-select');
    const snakeSkinSelect = document.getElementById('snake-skin-select');
    const foodStyleSelect = document.getElementById('food-style-select');
    const devCodeInput = document.getElementById('dev-code-input');
    const devApplyBtn = document.getElementById('dev-apply');

    const STORAGE_KEY = 'classic-snake-progress-v1';
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    const difficultySettings = { easy: 135, medium: 100, hard: 75, insane: 55 };
    const DEV_CODE = '1923';

    const colorThemes = {
      classic: { label: 'Classic Green', minScore: 0, head: ['#b7ff7a', '#55ff88', '#1bcf73'], body: ['#67ffd5', '#21e6b2', '#00b7d8'] },
      electric: { label: 'Electric Blue', minScore: 60, head: ['#8fe7ff', '#4ad5ff', '#1d8cff'], body: ['#5ee3ff', '#34d3a1', '#2bb3ff'] },
      ruby: { label: 'Ruby Red', minScore: 140, head: ['#ffb4b4', '#ff6b6b', '#ff3d5a'], body: ['#ff7b7b', '#ff4d84', '#ff2d6d'] },
      violet: { label: 'Violet Pulse', minScore: 260, head: ['#f2d1ff', '#ce8bff', '#9d4dff'], body: ['#d7b5ff', '#af6aff', '#7a52ff'] },
      gold: { label: 'Golden Rush', minScore: 420, head: ['#ffe8a3', '#ffcc66', '#ff9f1c'], body: ['#ffd36c', '#ffb347', '#ff7a18'] },
      emerald: { label: 'Emerald Flux', minScore: 620, head: ['#d6ffe6', '#7af7c9', '#1fc38a'], body: ['#a6f5cb', '#46dc96', '#1cad7d'] },
      sunrise: { label: 'Sunset Fade', minScore: 860, head: ['#ffe2b3', '#ff9f66', '#ff5f6d'], body: ['#ffd3a3', '#ff8b5e', '#ff5a7f'] },
      obsidian: { label: 'Obsidian', minScore: 1120, head: ['#f0f4ff', '#7a8ca8', '#2e3952'], body: ['#bac7df', '#6b7ea6', '#3f4d6d'] }
    };

    const skinThemes = {
      classic: { label: 'Classic', minScore: 0, accent: 'rgba(255,255,255,0.18)' },
      pulse: { label: 'Pulse', minScore: 70, accent: 'rgba(117, 225, 255, 0.45)' },
      shadow: { label: 'Shadow', minScore: 170, accent: 'rgba(167,120,255,0.38)' },
      arcade: { label: 'Arcade', minScore: 280, accent: 'rgba(255, 255, 255, 0.30)' },
      galaxy: { label: 'Galaxy', minScore: 440, accent: 'rgba(255, 191, 94, 0.34)' },
      dragon: { label: 'Dragon', minScore: 660, accent: 'rgba(255, 99, 132, 0.42)' },
      stealth: { label: 'Stealth', minScore: 920, accent: 'rgba(119, 247, 192, 0.36)' },
      prism: { label: 'Prism', minScore: 1200, accent: 'rgba(135, 255, 255, 0.42)' }
    };

    const foodThemes = {
      apple: { label: 'Apple', minScore: 0, shape: 'apple', glow: '#ff5a7d', colors: ['#ffeef3', '#ffc3d1', '#ff5a7d', '#ed2f5f', '#661122'] },
      berry: { label: 'Berry', minScore: 40, shape: 'berry', glow: '#a66dff', colors: ['#f7ebff', '#d5b6ff', '#8d5cff', '#6b35d9', '#2e1657'] },
      lemon: { label: 'Lemon', minScore: 110, shape: 'lemon', glow: '#f9d86b', colors: ['#fffde8', '#fff1a8', '#f9d86b', '#f4b942', '#7a4a00'] },
      grape: { label: 'Grape', minScore: 200, shape: 'grape', glow: '#b06aff', colors: ['#f3ebff', '#ddc3ff', '#a460ff', '#7d41da', '#2a0f4d'] },
      orange: { label: 'Orange', minScore: 320, shape: 'orange', glow: '#ff9f43', colors: ['#fff1d8', '#ffd69e', '#ff9f43', '#ff6a00', '#7a2900'] },
      watermelon: { label: 'Watermelon', minScore: 500, shape: 'watermelon', glow: '#ff5b75', colors: ['#fff7f3', '#ffb9c8', '#ff5b75', '#fc2949', '#650f1a'] },
      peach: { label: 'Peach', minScore: 700, shape: 'peach', glow: '#ffbf8d', colors: ['#fff3e8', '#ffd4ad', '#ffbf8d', '#ff8a4a', '#7d3d16'] },
      starfruit: { label: 'Starfruit', minScore: 980, shape: 'starfruit', glow: '#80e5a3', colors: ['#ecfff0', '#c2f0d0', '#80e5a3', '#35b87c', '#0f5a34'] },
      mango: { label: 'Mango', minScore: 1300, shape: 'mango', glow: '#ffbd5a', colors: ['#fff5d9', '#ffd989', '#ffbd5a', '#ff8b2b', '#7c3d08'] }
    };

    const maps = {
      classic: { name: 'Classic', walls: [], spawn: [{ x: 10, y: 10 }], direction: { x: 1, y: 0 } },
      maze: {
        name: 'Maze',
        walls: [
          ...Array.from({ length: 16 }, (_, i) => [4, i + 2]),
          ...Array.from({ length: 16 }, (_, i) => [14, i + 2]),
          ...Array.from({ length: 16 }, (_, i) => [i + 2, 8]),
          ...Array.from({ length: 16 }, (_, i) => [i + 2, 12])
        ].filter(([x, y]) => !(x === 10 && y === 10)),
        spawn: [{ x: 9, y: 10 }, { x: 10, y: 10 }, { x: 11, y: 10 }],
        direction: { x: 1, y: 0 }
      },
      cross: {
        name: 'Cross',
        walls: [
          ...Array.from({ length: 10 }, (_, i) => [i + 5, 9]),
          ...Array.from({ length: 10 }, (_, i) => [9, i + 5]),
          ...Array.from({ length: 7 }, (_, i) => [i + 6, 15]),
          ...Array.from({ length: 7 }, (_, i) => [i + 6, 4]),
          ...Array.from({ length: 7 }, (_, i) => [15, i + 6]),
          ...Array.from({ length: 7 }, (_, i) => [4, i + 6])
        ],
        spawn: [{ x: 2, y: 10 }, { x: 3, y: 10 }, { x: 4, y: 10 }],
        direction: { x: 1, y: 0 }
      },
      spiral: {
        name: 'Spiral',
        walls: [
          ...Array.from({ length: 17 }, (_, i) => [i + 2, 2]),
          ...Array.from({ length: 16 }, (_, i) => [17, i + 2]),
          ...Array.from({ length: 15 }, (_, i) => [17 - i, 17]),
          ...Array.from({ length: 15 }, (_, i) => [2, 17 - i]),
          ...Array.from({ length: 11 }, (_, i) => [i + 4, 6]),
          ...Array.from({ length: 11 }, (_, i) => [15, i + 6]),
          ...Array.from({ length: 11 }, (_, i) => [15 - i, 13]),
          ...Array.from({ length: 11 }, (_, i) => [4, 13 - i])
        ],
        spawn: [{ x: 3, y: 10 }, { x: 4, y: 10 }, { x: 5, y: 10 }],
        direction: { x: 1, y: 0 }
      },
      ring: {
        name: 'Ring',
        walls: [
          ...Array.from({ length: 18 }, (_, i) => [i + 1, 1]),
          ...Array.from({ length: 18 }, (_, i) => [i + 1, 18]),
          ...Array.from({ length: 18 }, (_, i) => [1, i + 1]),
          ...Array.from({ length: 18 }, (_, i) => [18, i + 1]),
          ...Array.from({ length: 8 }, (_, i) => [4 + i, 6]),
          ...Array.from({ length: 8 }, (_, i) => [4 + i, 13]),
          ...Array.from({ length: 8 }, (_, i) => [6, 4 + i]),
          ...Array.from({ length: 8 }, (_, i) => [13, 4 + i])
        ].filter(([x, y]) => !(x === 9 && y === 10) && !(x === 10 && y === 10) && !(x === 11 && y === 10)),
        spawn: [{ x: 8, y: 10 }, { x: 9, y: 10 }, { x: 10, y: 10 }],
        direction: { x: 1, y: 0 }
      },
      labyrinth: {
        name: 'Labyrinth',
        walls: [
          ...Array.from({ length: 7 }, (_, i) => [3 + i, 4]),
          ...Array.from({ length: 8 }, (_, i) => [10, 3 + i]),
          ...Array.from({ length: 10 }, (_, i) => [4 + i, 9]),
          ...Array.from({ length: 7 }, (_, i) => [7 + i, 14]),
          ...Array.from({ length: 8 }, (_, i) => [15, 5 + i]),
          ...Array.from({ length: 6 }, (_, i) => [3 + i, 16]),
          ...Array.from({ length: 7 }, (_, i) => [12 + i, 7]),
          ...Array.from({ length: 7 }, (_, i) => [5, 10 + i])
        ],
        spawn: [{ x: 2, y: 10 }, { x: 3, y: 10 }, { x: 4, y: 10 }],
        direction: { x: 1, y: 0 }
      },
      diamond: {
        name: 'Diamond',
        walls: [
          ...Array.from({ length: 10 }, (_, i) => [10 - i, 10 - i]),
          ...Array.from({ length: 10 }, (_, i) => [10 + i, 10 - i]),
          ...Array.from({ length: 10 }, (_, i) => [10 - i, 10 + i]),
          ...Array.from({ length: 10 }, (_, i) => [10 + i, 10 + i]),
          ...Array.from({ length: 4 }, (_, i) => [6 + i, 10]),
          ...Array.from({ length: 4 }, (_, i) => [10, 6 + i]),
          ...Array.from({ length: 4 }, (_, i) => [14 - i, 10]),
          ...Array.from({ length: 4 }, (_, i) => [10, 14 - i])
        ].filter(([x, y]) => !(x === 10 && y === 10) && !(x === 11 && y === 10) && !(x === 9 && y === 10)),
        spawn: [{ x: 4, y: 10 }, { x: 5, y: 10 }, { x: 6, y: 10 }],
        direction: { x: 1, y: 0 }
      }
    };

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let score = 0;
    let highScore = 0;
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let currentMap = 'classic';
    let currentDifficulty = 'medium';
    let selectedColorKey = 'classic';
    let selectedSkinKey = 'classic';
    let selectedFoodKey = 'apple';
    let gameInterval = null;
    let gameRunning = false;
    let devEnabled = false;
    let devState = {
      god: false,
      noWalls: false,
      ghost: false,
      autoEat: false,
      slow: false,
      grid: false,
      speedMultiplier: 1
    };

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (typeof parsed.highScore === 'number') highScore = parsed.highScore;
        if (parsed.snakeColor) selectedColorKey = parsed.snakeColor;
        if (parsed.snakeSkin) selectedSkinKey = parsed.snakeSkin;
        if (parsed.foodStyle) selectedFoodKey = parsed.foodStyle;
      } catch (error) {
        console.warn('Unable to load snake progress', error);
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        highScore,
        snakeColor: selectedColorKey,
        snakeSkin: selectedSkinKey,
        foodStyle: selectedFoodKey
      }));
    }

    function updateHighScoreDisplay() {
      highScoreEl.textContent = highScore;
      scoreEl.textContent = score;
      saveProgress();
    }

    function setStatus(label, kind = '') {
      statusPill.textContent = label;
      statusPill.classList.remove('warn', 'danger');
      if (kind === 'warn') statusPill.classList.add('warn');
      if (kind === 'danger') statusPill.classList.add('danger');
    }

    function getUnlockedOptions() {
      return {
        color: Object.entries(colorThemes).filter(([key, theme]) => highScore >= theme.minScore).map(([key]) => key),
        skin: Object.entries(skinThemes).filter(([key, theme]) => highScore >= theme.minScore).map(([key]) => key),
        food: Object.entries(foodThemes).filter(([key, theme]) => highScore >= theme.minScore).map(([key]) => key)
      };
    }

    function populateCustomizationOptions() {
      const unlocked = getUnlockedOptions();
      const buildOptions = (select, optionsMap, currentValue) => {
        select.innerHTML = '';
        let hasValidCurrent = false;
        const keyName = select.id.includes('color') ? 'color' : select.id.includes('skin') ? 'skin' : 'food';

        Object.entries(optionsMap).forEach(([key, option]) => {
          const unlockedForThis = unlocked[keyName].includes(key);
          const optionEl = document.createElement('option');
          optionEl.value = key;
          optionEl.textContent = `${option.label}${unlockedForThis ? '' : ' (Locked: ' + option.minScore + ')'}`;
          optionEl.disabled = !unlockedForThis;
          if (key === currentValue && unlockedForThis) {
            optionEl.selected = true;
            hasValidCurrent = true;
          }
          select.appendChild(optionEl);
        });

        if (!hasValidCurrent) {
          const fallback = Object.keys(optionsMap).find((key) => unlocked[keyName].includes(key)) || Object.keys(optionsMap)[0];
          if (fallback) select.value = fallback;
        }
      };

      buildOptions(snakeColorSelect, colorThemes, selectedColorKey);
      buildOptions(snakeSkinSelect, skinThemes, selectedSkinKey);
      buildOptions(foodStyleSelect, foodThemes, selectedFoodKey);
    }

    function openCustomizeMenu() {
      populateCustomizationOptions();
      customizeModal.classList.add('visible');
      customizeModal.setAttribute('aria-hidden', 'false');
    }

    function closeCustomizeMenu() {
      customizeModal.classList.remove('visible');
      customizeModal.setAttribute('aria-hidden', 'true');
    }

    function applyChosenCustomization() {
      selectedColorKey = snakeColorSelect.value;
      selectedSkinKey = snakeSkinSelect.value;
      selectedFoodKey = foodStyleSelect.value;
      saveProgress();
      closeCustomizeMenu();
      render();
    }

    function getCurrentTheme() {
      return {
        color: colorThemes[selectedColorKey] || colorThemes.classic,
        skin: skinThemes[selectedSkinKey] || skinThemes.classic,
        food: foodThemes[selectedFoodKey] || foodThemes.apple
      };
    }

    function wallExists(x, y) {
      return maps[currentMap].walls.some(([wallX, wallY]) => wallX === x && wallY === y);
    }

    function snakeHitsCell(x, y, ignoreTail = false) {
      return snake.some((part, index) => {
        if (ignoreTail && index === snake.length - 1) return false;
        return part.x === x && part.y === y;
      });
    }

    function randomFoodCell() {
      let tries = 0;
      while (tries < 500) {
        const x = Math.floor(Math.random() * tileCount);
        const y = Math.floor(Math.random() * tileCount);
        if (!wallExists(x, y) && !snakeHitsCell(x, y, true)) {
          return { x, y };
        }
        tries++;
      }
      return { x: 10, y: 10 };
    }

    function syncMapAndDirection() {
      const selectedMap = maps[currentMap];
      snake = selectedMap.spawn.map(segment => ({ ...segment }));
      dx = selectedMap.direction.x;
      dy = selectedMap.direction.y;
      nextDx = dx;
      nextDy = dy;
      food = randomFoodCell();
    }

    function startGame() {
      syncMapAndDirection();
      score = 0;
      gameRunning = true;
      boardOverlay.classList.add('hidden');
      updateHighScoreDisplay();
      setStatus('Running');
      clearInterval(gameInterval);
      const tick = Math.max(35, difficultySettings[currentDifficulty] / (devState.speedMultiplier || 1));
      gameInterval = setInterval(stepGame, tick);
    }

    function endGame() {
      gameRunning = false;
      clearInterval(gameInterval);
      boardOverlay.textContent = devState.god ? 'Cheat Mode' : 'Game Over';
      boardOverlay.classList.remove('hidden');
      setStatus('Game Over', 'danger');
      if (score > highScore) {
        highScore = score;
        updateHighScoreDisplay();
      }
    }

    function setSpeedMultiplier(multiplier) {
      devState.speedMultiplier = Number(multiplier) || 1;
      if (gameRunning) {
        clearInterval(gameInterval);
        const tick = Math.max(35, difficultySettings[currentDifficulty] / devState.speedMultiplier);
        gameInterval = setInterval(stepGame, tick);
      }
    }

    function changeDirection(newDx, newDy) {
      if (snake.length > 1 && newDx === -dx && newDy === -dy) return;
      nextDx = newDx;
      nextDy = newDy;
    }

    function stepGame() {
      if (!gameRunning) return;

      dx = nextDx;
      dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (devState.noWalls) {
        if (head.x < 0) head.x = tileCount - 1;
        if (head.y < 0) head.y = tileCount - 1;
        if (head.x >= tileCount) head.x = 0;
        if (head.y >= tileCount) head.y = 0;
      } else if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || wallExists(head.x, head.y)) {
        if (devState.god) {
          head.x = ((head.x % tileCount) + tileCount) % tileCount;
          head.y = ((head.y % tileCount) + tileCount) % tileCount;
        } else {
          endGame();
          return;
        }
      }

      const willEat = head.x === food.x && head.y === food.y;
      if (!devState.ghost && snakeHitsCell(head.x, head.y, true) && !(willEat && head.x === food.x && head.y === food.y)) {
        if (devState.god) {
          // ignore crash while god mode is enabled
        } else {
          endGame();
          return;
        }
      }

      snake.unshift(head);
      if (willEat) {
        score += devState.autoEat ? 2 : 1;
        if (score > highScore) {
          highScore = score;
          updateHighScoreDisplay();
        }
        food = randomFoodCell();
        if (devState.autoEat) {
          score += 1;
          if (score > highScore) highScore = score;
          food = randomFoodCell();
        }
      } else {
        snake.pop();
      }

      if (devState.autoEat) {
        food = randomFoodCell();
      }

      if (score > highScore) {
        highScore = score;
      }

      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      render();
    }

    function drawGrid() {
      if (!devState.grid) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(121, 232, 255, 0.12)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize + 0.5, 0);
        ctx.lineTo(i * gridSize + 0.5, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize + 0.5);
        ctx.lineTo(canvas.width, i * gridSize + 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawWalls() {
      const wallColor = '#0e3b7a';
      const wallGlow = '#6ce3ff';
      maps[currentMap].walls.forEach(([wallX, wallY]) => {
        const px = wallX * gridSize + 1;
        const py = wallY * gridSize + 1;
        const size = gridSize - 2;
        ctx.fillStyle = wallColor;
        ctx.fillRect(px, py, size, size);
        ctx.strokeStyle = wallGlow;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px + 1, py + 1, size - 2, size - 2);
      });
    }

    function roundedRectPath(x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawHeadSegment(segmentX, segmentY) {
      const theme = getCurrentTheme();
      const x = segmentX * gridSize + 1;
      const y = segmentY * gridSize + 1;
      const size = gridSize - 2;
      const radius = Math.min(8, size * 0.45);

      const headGradient = ctx.createLinearGradient(x, y, x + size, y + size);
      headGradient.addColorStop(0, theme.color.head[0]);
      headGradient.addColorStop(0.35, theme.color.head[1]);
      headGradient.addColorStop(1, theme.color.head[2]);

      roundedRectPath(x, y, size, size, radius + 2);
      ctx.fillStyle = headGradient;
      ctx.fill();

      ctx.fillStyle = 'rgba(10, 16, 20, 0.64)';
      const eyeY = y + size * 0.32;
      const eyeX1 = x + size * 0.28;
      const eyeX2 = x + size * 0.68;
      const eyeSizeX = size * 0.12;
      const eyeSizeY = size * 0.12;

      ctx.beginPath();
      ctx.ellipse(eyeX1 + (dx === 1 ? 2.5 : dx === -1 ? -2.5 : 0), eyeY + (dy === 1 ? 2.5 : dy === -1 ? -2.5 : 0), eyeSizeX, eyeSizeY, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(eyeX2 + (dx === 1 ? 2.5 : dx === -1 ? -2.5 : 0), eyeY + (dy === 1 ? 2.5 : dy === -1 ? -2.5 : 0), eyeSizeX, eyeSizeY, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f6fffe';
      ctx.beginPath();
      ctx.ellipse(eyeX1 + (dx === 1 ? 3.5 : dx === -1 ? -3.5 : 0), eyeY + (dy === 1 ? 3.5 : dy === -1 ? -3.5 : 0), eyeSizeX * 0.38, eyeSizeY * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(eyeX2 + (dx === 1 ? 3.5 : dx === -1 ? -3.5 : 0), eyeY + (dy === 1 ? 3.5 : dy === -1 ? -3.5 : 0), eyeSizeX * 0.38, eyeSizeY * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();

      const mouthX = x + size / 2 + dx * (size * 0.42);
      const mouthY = y + size / 2 + dy * (size * 0.42);
      const mouthAngle = Math.atan2(dy, dx) || 0;
      ctx.strokeStyle = 'rgba(22, 10, 14, 0.9)';
      ctx.lineWidth = 2.3;
      ctx.beginPath();
      ctx.arc(mouthX, mouthY, size * 0.13, mouthAngle - 0.7, mouthAngle + 0.7);
      ctx.stroke();
    }

    function drawSkinDetails(x, y, size, isHead = false) {
      const theme = getCurrentTheme();
      const accent = theme.skin.accent;
      ctx.save();
      switch (selectedSkinKey) {
        case 'pulse':
          ctx.strokeStyle = accent;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(x + 3, y + size * 0.5);
          ctx.lineTo(x + size - 3, y + size * 0.5);
          ctx.stroke();
          break;
        case 'shadow':
          ctx.fillStyle = 'rgba(8, 10, 18, 0.28)';
          ctx.fillRect(x + size * 0.26, y + size * 0.2, size * 0.48, size * 0.55);
          break;
        case 'arcade':
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.fillRect(x + 3, y + 3, size * 0.28, size * 0.28);
          ctx.fillRect(x + size * 0.68, y + size * 0.45, size * 0.25, size * 0.25);
          break;
        case 'galaxy':
          ctx.fillStyle = accent;
          for (let i = 0; i < 3; i++) {
            const px = x + 4 + i * (size / 3);
            const py = y + 5 + ((i % 2) * size) / 2;
            ctx.beginPath();
            ctx.arc(px, py, 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        case 'dragon':
          ctx.strokeStyle = accent;
          ctx.lineWidth = 1.7;
          ctx.beginPath();
          ctx.moveTo(x + 3, y + size * 0.7);
          ctx.lineTo(x + size * 0.5, y + size * 0.25);
          ctx.lineTo(x + size - 3, y + size * 0.7);
          ctx.stroke();
          break;
        case 'stealth':
          ctx.fillStyle = 'rgba(7, 12, 20, 0.28)';
          ctx.fillRect(x + size * 0.22, y + size * 0.2, size * 0.56, size * 0.46);
          break;
        case 'prism':
          ctx.strokeStyle = accent;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x + 5, y + size - 4);
          ctx.lineTo(x + size * 0.5, y + 4);
          ctx.lineTo(x + size - 5, y + size - 4);
          ctx.stroke();
          break;
        default:
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          if (isHead) {
            ctx.fillRect(x + 2, y + 2, size * 0.54, size * 0.26);
          } else {
            ctx.fillRect(x + 3, y + 3, size * 0.32, size * 0.28);
          }
          break;
      }
      ctx.restore();
    }

    function drawSnakeBody() {
      if (snake.length === 0) return;
      const theme = getCurrentTheme();
      const points = snake.map(part => ({ x: part.x * gridSize + gridSize / 2, y: part.y * gridSize + gridSize / 2 }));
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, theme.color.body[0]);
      gradient.addColorStop(0.45, theme.color.body[1]);
      gradient.addColorStop(1, theme.color.body[2]);

      ctx.save();
      ctx.strokeStyle = gradient;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(122, 225, 255, 0.42)';
      ctx.lineWidth = gridSize * 0.74;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const prev = points[i - 1];
        const curr = points[i];
        const midX = (prev.x + curr.x) / 2;
        const midY = (prev.y + curr.y) / 2;
        if (i === 1) ctx.lineTo(midX, midY);
        else ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
      }
      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      ctx.restore();

      snake.slice(1).forEach((segment) => {
        const x = segment.x * gridSize + 1;
        const y = segment.y * gridSize + 1;
        const size = gridSize - 2;
        drawSkinDetails(x, y, size, false);
      });

      drawHeadSegment(snake[0].x, snake[0].y);
    }

    function drawFoodShape(theme, radius, pulse) {
      const colors = theme.colors;
      const primary = colors[2];
      const highlight = colors[0];

      switch (theme.shape) {
        case 'apple': {
          const g = ctx.createRadialGradient(-4, -6, 4, 0, 0, radius * 1.4);
          g.addColorStop(0, highlight);
          g.addColorStop(0.4, colors[1]);
          g.addColorStop(1, primary);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.82 * pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#4baa61';
          ctx.beginPath();
          ctx.moveTo(0, -radius * 0.5);
          ctx.quadraticCurveTo(7, -radius * 0.8, 4, -radius * 1.2);
          ctx.quadraticCurveTo(0, -radius * 1.4, -4, -radius * 1.2);
          ctx.quadraticCurveTo(-7, -radius * 0.8, 0, -radius * 0.5);
          ctx.fill();
          ctx.strokeStyle = '#2d6a35';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(0, -radius * 0.85);
          ctx.lineTo(0, -radius * 1.35);
          ctx.stroke();
          break;
        }
        case 'berry': {
          for (let i = 0; i < 3; i++) {
            const offsetX = (i - 1) * radius * 0.28;
            const offsetY = i === 1 ? -radius * 0.1 : radius * 0.2;
            ctx.fillStyle = [colors[2], colors[1], colors[3]][i];
            ctx.beginPath();
            ctx.arc(offsetX, offsetY, radius * 0.32 * pulse, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }
        case 'lemon': {
          ctx.fillStyle = '#ffe582';
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.75 * pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#d4b83e';
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.36 * pulse, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        default: {
          ctx.fillStyle = primary;
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.72 * pulse, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
      }
    }

    function drawFood() {
      const theme = getCurrentTheme().food;
      const pulse = 1 + Math.sin(Date.now() / 150) * 0.08;
      const cx = food.x * gridSize + gridSize / 2;
      const cy = food.y * gridSize + gridSize / 2;
      const radius = gridSize * 0.38;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.shadowBlur = 18;
      ctx.shadowColor = theme.glow;
      drawFoodShape(theme, radius, pulse);
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#040915';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawWalls();
      drawFood();
      drawSnakeBody();
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
    }

    function handleKeydown(event) {
      const key = event.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') changeDirection(0, -1);
      if (key === 'arrowdown' || key === 's') changeDirection(0, 1);
      if (key === 'arrowleft' || key === 'a') changeDirection(-1, 0);
      if (key === 'arrowright' || key === 'd') changeDirection(1, 0);
      if (key === ' ') {
        event.preventDefault();
        if (gameRunning) {
          gameRunning = false;
          clearInterval(gameInterval);
          setStatus('Paused');
        } else {
          gameRunning = true;
          setStatus('Running');
          clearInterval(gameInterval);
          const tick = Math.max(35, difficultySettings[currentDifficulty] / devState.speedMultiplier);
          gameInterval = setInterval(stepGame, tick);
        }
      }

      if (event.key >= '0' && event.key <= '9') {
        devCodeInput.value += event.key;
        if (devCodeInput.value.length > 4) devCodeInput.value = devCodeInput.value.slice(-4);
      }

      if (key === 'enter' && devCodeInput.value === DEV_CODE) {
        toggleDevPanel(true);
      }
    }

    function toggleDevPanel(forceOpen) {
      devEnabled = forceOpen !== undefined ? forceOpen : !devEnabled;
      if (devEnabled) {
        openCustomizeMenu();
        devCodeInput.value = DEV_CODE;
        statusPill.textContent = 'Dev Mode';
        statusPill.classList.remove('warn', 'danger');
      } else {
        closeCustomizeMenu();
        devCodeInput.value = '';
      }
    }

    function applyDevSettings() {
      devState.god = document.getElementById('dev-god').checked;
      devState.noWalls = document.getElementById('dev-no-walls').checked;
      devState.ghost = document.getElementById('dev-ghost').checked;
      devState.autoEat = document.getElementById('dev-auto-eat').checked;
      devState.slow = document.getElementById('dev-slow').checked;
      devState.grid = document.getElementById('dev-grid').checked;
      devState.speedMultiplier = Number(document.getElementById('dev-speed').value) || 1;
      setSpeedMultiplier(devState.speedMultiplier);
      const growAmount = Number(document.getElementById('dev-grow').value) || 5;
      if (growAmount > 0) {
        for (let i = 0; i < growAmount; i++) {
          snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y });
        }
      }
      if (devState.slow) {
        setStatus('Slow Mode');
      } else if (devState.god) {
        setStatus('God Mode');
      } else {
        setStatus(gameRunning ? 'Running' : 'Ready');
      }
      render();
    }

    function attachEvents() {
      btnStart.addEventListener('click', startGame);
      btnCustomize.addEventListener('click', openCustomizeMenu);
      closeCustomize.addEventListener('click', closeCustomizeMenu);
      saveCustomize.addEventListener('click', applyChosenCustomization);
      devApplyBtn.addEventListener('click', () => {
        applyDevSettings();
        closeCustomizeMenu();
      });
      difficultySelect.addEventListener('change', (event) => {
        currentDifficulty = event.target.value;
        if (gameRunning) {
          clearInterval(gameInterval);
          const tick = Math.max(35, difficultySettings[currentDifficulty] / devState.speedMultiplier);
          gameInterval = setInterval(stepGame, tick);
        }
      });
      mapSelect.addEventListener('change', (event) => {
        currentMap = event.target.value;
        syncMapAndDirection();
        render();
      });
      document.addEventListener('keydown', handleKeydown);
      document.addEventListener('pointerdown', (event) => {
        if (!event.target.closest('input, select, button')) {
          const code = devCodeInput.value || '';
          if (code === DEV_CODE) toggleDevPanel(true);
        }
      });
      devCodeInput.addEventListener('input', () => {
        if (devCodeInput.value === DEV_CODE) {
          toggleDevPanel(true);
        }
      });
    }

    function initialize() {
      loadProgress();
      populateCustomizationOptions();
      currentDifficulty = difficultySelect.value;
      currentMap = mapSelect.value;
      syncMapAndDirection();
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      render();
      attachEvents();
      setStatus('Ready');
    }

    initialize();
  </script>
</body>
</html>
